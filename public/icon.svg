<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8bfffe" />
      <stop offset="100%" stop-color="#38e8ff" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9b51f5" />
      <stop offset="100%" stop-color="#7028d9" />
    </linearGradient>
  </defs>
  <!-- Rounded App Tile Background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Plate 3D Offset Shadow -->
  <circle cx="256" cy="274" r="186" fill="#1E1B2E" opacity="0.22" />
  <!-- Outer Brand Purple Rim -->
  <circle cx="256" cy="256" r="184" fill="url(#rimGrad)" stroke="#1E1B2E" stroke-width="18" />
  <!-- Inner White Ceramic Plate -->
  <circle cx="256" cy="256" r="144" fill="#ffffff" stroke="#1E1B2E" stroke-width="14" />
  <!-- NutriPlato 3-Sector Divided Plate (50% Left Green, 25% Top-Right Coral/Red, 25% Bottom-Right Yellow) -->
  <!-- 50% Left Half: Frutas y Vegetales (#5dd118) -->
  <path d="M 256 126 A 130 130 0 0 0 256 386 Z" fill="#5dd118" />
  <!-- 25% Top-Right Quarter: Proteínas (#fc3e7e) -->
  <path d="M 256 256 L 256 126 A 130 130 0 0 1 386 256 Z" fill="#fc3e7e" />
  <!-- 25% Bottom-Right Quarter: Energía (#fee330) -->
  <path d="M 256 256 L 386 256 A 130 130 0 0 1 256 386 Z" fill="#fee330" />
  <!-- Crisp Cartoon Sector Dividers & Inner Ring -->
  <line x1="256" y1="120" x2="256" y2="392" stroke="#1E1B2E" stroke-width="13" stroke-linecap="round" />
  <line x1="256" y1="256" x2="392" y2="256" stroke="#1E1B2E" stroke-width="13" stroke-linecap="round" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#1E1B2E" stroke-width="13" />
  <!-- Center Joyful Star Badge -->
  <path
    d="M 256 206 L 270 238 L 304 242 L 278 265 L 286 298 L 256 280 L 226 298 L 234 265 L 208 242 L 242 238 Z"
    fill="#ffffff"
    stroke="#1E1B2E"
    stroke-width="12"
    stroke-linejoin="round"
  />
  <!-- Top-Right Comic Sparkle -->
  <path
    d="M 426 68 L 436 96 L 464 106 L 436 116 L 426 144 L 416 116 L 388 106 L 416 96 Z"
    fill="#fee330"
    stroke="#1E1B2E"
    stroke-width="10"
    stroke-linejoin="round"
  />
</svg>
